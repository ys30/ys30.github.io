<title id="t">Verified SRP ERA5 site exposure and matched PyPSA weather-proxy sensitivity</title>
<desc id="d">Left: identical eight natural gas plants have January mean 11.90 Celsius and July mean 37.00 Celsius; the identical coal plant has January mean 2.09 and July mean 26.26 Celsius. Right: matched PyPSA model artificial coverage gaps, 113630 MWh fixed wind, 114696 ERA5 low-threshold, 120557 ERA5 reference, and 125450 ERA5 high-threshold. These are not observed outages.</desc>
