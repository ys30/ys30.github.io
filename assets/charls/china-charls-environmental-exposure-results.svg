<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900"><rect width="1500" height="900" fill="#fbfcfa"/><style>.t{font-family:Arial;fill:#17372d}.m{font-family:Arial;fill:#617169}.h{font-weight:700}.p{fill:#fff;stroke:#d9e5dd;stroke-width:2}.z{stroke:#89968f;stroke-width:2;stroke-dasharray:7 7}.ci{stroke:#2d6b50;stroke-width:5;stroke-linecap:round}.d{fill:#216847}.soft{stroke:#aebbb4;stroke-width:4}.lab{font-size:19px}.sm{font-size:16px}.num{font-size:17px;font-weight:700;fill:#245844}</style><text x="65" y="65" class="t h" font-size="38">Greenness, air pollution and depressive symptoms across China</text><text x="65" y="102" class="m" font-size="20">Remote-sensing exposure engineering linked with longitudinal CHARLS data</text><rect x="55" y="135" width="620" height="330" rx="22" fill="#f1f6f2" stroke="#d9e5dd" stroke-width="2"/><text x="85" y="180" class="t h" font-size="24">A · China-wide exposure workflow</text><text x="90" y="235" class="t lab">MOD13A3 monthly NDVI · 1 km</text><text x="90" y="285" class="m lab">↓ Pixel Reliability QA + valid-pixel coverage</text><text x="90" y="335" class="m lab">↓ MCD12Q1 urban / non-urban masks</text><text x="90" y="385" class="m lab">↓ Prefecture × month NDVI · 2005–2020</text><text x="90" y="435" class="t h lab">→ PM₂.₅ + CHARLS → longitudinal CESD-10 models</text><rect x="705" y="135" width="740" height="330" rx="22" class="p"/><text x="735" y="180" class="t h" font-size="24">B · Primary association</text><text x="735" y="208" class="m sm">Final fully adjusted contextual specifications · per +0.1 NDVI</text><line x1="1290" y1="230" x2="1290" y2="420" class="z"/><text x="735" y="270" class="t lab">Alternative contextual set A</text><line x1="1006" y1="264" x2="1245" y2="264" class="ci"/><circle cx="1126" cy="264" r="10" class="d"/><text x="1260" y="270" class="num">−0.496</text><text x="735" y="335" class="t lab">Alternative contextual set B</text><line x1="1008" y1="329" x2="1247" y2="329" class="ci"/><circle cx="1